[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quasar-core"
version = "0.4.0"
description = "Autonomous agentic system for atomistic computational chemistry research"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Feng Xu Yang" },
]
keywords = [
    "computational-chemistry",
    "autonomous-agents",
    "atomistic-simulation",
    "DFT",
    "molecular-dynamics",
    "ORCA",
    "quantum-espresso",
    "materials-science",
    "LLM",
    "AI-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "langchain>=1.0.2",
    "langchain-openai>=1.0.0",
    "langchain-google-genai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-xai>=1.0.0",
    "google-genai>=0.2.0",
    "langgraph>=1.0.1",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "python-dotenv>=1.2.1",
    "chromadb>=0.4.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-text-splitters>=0.2.0",
    "langchain-huggingface>=0.0.3",
    "sentence-transformers>=2.2.0",
    "ddgs>=0.1.0",
    "pymatgen>=2025.10.7",
    "mp-api>=0.45.13",
    "ase>=3.26.0",
    "rdkit",
    "mace-torch>=0.3.14",
    "lxml>=6.0.2",
    "numpy>=1.26.0,<2.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "matplotlib",
    "pandas",
    "seaborn",
    "pypdf>=4.0.0",
    "pysocks",
    "psutil",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine",
]

[project.scripts]
quasar = "quasar_cli.main:main"

[project.urls]
Homepage = "https://github.com/fengxuyy/QUASAR"
Documentation = "https://fengxuyy.github.io/QUASAR-CHEM/"
Repository = "https://github.com/fengxuyy/QUASAR"
Issues = "https://github.com/fengxuyy/QUASAR/issues"

[tool.hatch.build]
artifacts = [
    "quasar_cli/cli_dist/*.mjs",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "bridge.py", "bridge_history.py", "quasar_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "bridge.py",
    "bridge_history.py",
    "quasar_cli/",
    "tests/",
    "LICENSE",
    "README.md",
    "requirements.txt",
    "pyproject.toml",
    "pytest.ini",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v -s"
pythonpath = ["."]
norecursedirs = ["workspace", ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv"]
