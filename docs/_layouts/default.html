<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
    <script defer src="{{ '/assets/docs-nav.js' | relative_url }}"></script>
  </head>
  <body>
    <div class="page-glow page-glow-a"></div>
    <div class="page-glow page-glow-b"></div>
    <div class="site-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <a class="brand" href="{{ '/' | relative_url }}" aria-label="QUASAR documentation home">
            <img src="{{ '/assets/quasar-logo.png' | relative_url }}" alt="QUASAR wordmark">
            <span class="brand-tag">Documentation</span>
          </a>
          <span class="brand-version" aria-label="QUASAR version">v{{ site.version }}</span>
        </div>
        <div class="topbar-actions">
          <a class="github-icon-button" href="{{ site.repository_url }}" target="_blank" rel="noopener noreferrer" aria-label="QUASAR on GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          </a>
        </div>
      </header>

      <div class="site-body">
        <aside class="sidebar">
          <div class="sidebar-panel">
            <p class="sidebar-label">Documentation</p>
            {% include nav.html %}
          </div>
        </aside>

        <main class="content">
          {% if page.show_title != false %}
            {% if page.section %}
              <p class="eyebrow">{{ page.section }}</p>
            {% endif %}
            <h1>{{ page.title }}</h1>
            {% if page.lead %}
              <p class="page-lead">{{ page.lead }}</p>
            {% endif %}
          {% endif %}
          {{ content }}
        </main>
      </div>

      <footer class="site-footer">
      </footer>
    </div>
  </body>
</html>
