name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build CLI and Web UI assets
        run: |
          (cd cli && npm ci && npm run build)
          (cd web && npm ci && npm run build)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify packaged UI assets in wheel
        run: |
          python -c "
          import glob, zipfile
          wheels = glob.glob('dist/quasar_core-*.whl')
          assert len(wheels) == 1, f'Expected 1 wheel, found {wheels}'
          with zipfile.ZipFile(wheels[0]) as z:
              names = set(z.namelist())
          required = [
              'bridge.py',
              'src/cli_launcher.py',
              'src/_packaged_ui/cli/dist/cli.js',
              'src/_packaged_ui/cli/package.json',
              'src/_packaged_ui/web/dist/index.html',
              'src/_packaged_ui/web/dist-server/index.js',
              'src/_packaged_ui/web/package.json',
              'src/_packaged_ui/web/server/scripts/structure_processor.py',
          ]
          missing = [r for r in required if r not in names]
          assert not missing, f'Missing packaged assets: {missing}'
          print(f'Verified {len(names)} files in {wheels[0]}')
          "

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quasar-core
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
